  <!-- Base Style -->
  <style>
    @font-face {
      font-family: "SUIT-Regular";
      src: url("https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_suit@1.0/SUIT-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "D2Coding";
      src: url("https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_three@1.0/D2Coding.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    html {
      width: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family:
        "SUIT-Regular",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        "Roboto",
        "Apple SD Gothic Neo",
        sans-serif;
    }

    h1,
    h3,
    figure {
      margin-top: 0;
    }

    figure {
      margin-bottom: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    p {
      line-height: 1.6;
      word-break: break-word;
      hyphens: auto;
    }

    li {
      padding: 6px 0;
    }

    span {
      font-size: 10px;
    }

    .intro-kr {
      font-size: 14px;
    }

    .body-text {
      font-family: "Noto Serif KR", serif;
      font-optical-sizing: auto;
    }

    .code-block {
      margin: 0 0 10px;
      font-family:
        "D2Coding",
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
      font-size: 18px;
      font-weight: 700;
    }

    @media (max-width: 1024px) {
      .code-block {
        font-size: 14px;
      }
    }

    /* vue-easy-lightbox */
    .vel-modal {
      position: fixed;
      inset: 0;
      z-index: 9999 !important;
      background: rgba(10, 10, 11, 0.92) !important;
      backdrop-filter: saturate(140%) blur(2px);
    }

    .vel-toolbar,
    .vel__toolbar,
    .vel-actions,
    .vel-icon-rotate,
    .vel-icon-zoom,
    .vel-icon-download,
    .vel-icon-fullscreen {
      display: none !important;
    }

    @media (min-resolution: 2dppx) {
      .vel-img,
      .vel-img img,
      .vel-img-wrap img {
        image-rendering: -webkit-optimize-contrast;
      }
    }
