/* ==========================================================================
   Global Lightbox & Gallery Overrides
   Target: vue-easy-lightbox (공통 접두사 .vel-*)
   파일 위치 예: src/styles/lightbox.css  (main.js 에서 전역 import)
   ========================================================================== */

/* ---------- 1) Lightbox Backdrop / Layer ---------- */

/* 라이트박스 전체 레이어 */
.vel-modal {
  position: fixed;
  inset: 0;
  z-index: 9999 !important;
  background: rgba(10, 10, 11, 0.92) !important; /* 더 어두운 배경 */
  backdrop-filter: saturate(140%) blur(2px);      /* 약한 블러 */
}

/* 고해상도 디스플레이에서 약간 더 선명하게 */
@media (min-resolution: 2dppx) {
  .vel-img,
  .vel-img img,
  .vel-img-wrap img {
    image-rendering: -webkit-optimize-contrast;
  }
}
    /* vue-easy-lightbox toolbar 숨기기 */
.vel-toolbar,
.vel__toolbar,
.vel-actions {
  display: none !important;
}
.vel-icon-rotate,
.vel-icon-zoom,
.vel-icon-download,
.vel-icon-fullscreen {
  display: none !important;
}
